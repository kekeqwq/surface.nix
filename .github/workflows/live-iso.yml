name: Surface live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live/**
      - scripts/inspect-live-iso.py
      - scripts/inspect-efi-payload.py
      - .github/workflows/live-iso.yml

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the text-only Surface installer
        run: nix build --print-out-paths .#packages.aarch64-linux.surface-live-iso
      - uses: actions/upload-artifact@v4
        with:
          name: surface-live-aarch64
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 7
