# Native Denali FullIO reference-render fixture: internal speakers (protected
# v19c render) plus the MicArray. Derived from the Golden v33 production UCM.
#
# PA Volume 24 (+27 dB) is the validated reference operating point for the
# protected two-amp machine; the machine's temporary PA cap at 6 is lifted
# only when the reference-render fixture is selected. RX0/RX1 Digital Volume
# stays at the upstream -3 dB ceiling (81). User volume remains in PipeWire;
# no PlaybackVolume is declared here.
SectionVerb {
    EnableSequence [
        cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"

        # Keep the MicArray FE -> TX backend link resident so profile
        # discovery can open the capture PCM. No DMIC clock powers up here.
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"

        # Softclip is unproven on this hardware; Windows never enables it.
        cset "name='WSA WSA_Softclip0 Enable' 0"
        cset "name='WSA WSA_Softclip1 Enable' 0"
        cset "name='WSA WSA_RX0 Digital Mute' 0"
        cset "name='WSA WSA_RX1 Digital Mute' 0"
        cset "name='WSA WSA_RX0 Digital Volume' 81"
        cset "name='WSA WSA_RX1 Digital Volume' 81"

        # Wsa1SpeakerEnableSeq-equivalent RX routing (macro instance 1):
        # AIF1_PB -> RX0/RX1 MUX -> RX0/RX1 INP0 -> DAC. Set explicitly in
        # the sequence; the shared Include form silently skipped inside a
        # sequence list and left the DAC input at ZERO.
        cset "name='WSA WSA RX0 MUX' AIF1_PB"
        cset "name='WSA WSA RX1 MUX' AIF1_PB"
        cset "name='WSA WSA_RX0 INP0' RX0"
        cset "name='WSA WSA_RX1 INP0' RX1"

        # Establish the complete VI transport before the first PCM open so
        # the coupled VI backend can prepare with the render FE.
        cset "name='SpkrLeft COMP Switch' 1"
        cset "name='SpkrLeft BOOST Switch' 1"
        cset "name='SpkrLeft DAC Switch' 1"
        cset "name='SpkrLeft PBR Switch' 1"
        cset "name='SpkrLeft VISENSE Switch' 1"
        cset "name='SpkrLeft CPS Switch' 1"
        cset "name='SpkrLeft WSA MODE' 0"
        cset "name='SpkrLeft PA Volume' 24"
        cset "name='SpkrRight COMP Switch' 1"
        cset "name='SpkrRight BOOST Switch' 1"
        cset "name='SpkrRight DAC Switch' 1"
        cset "name='SpkrRight PBR Switch' 1"
        cset "name='SpkrRight VISENSE Switch' 1"
        cset "name='SpkrRight CPS Switch' 1"
        cset "name='SpkrRight WSA MODE' 0"
        cset "name='SpkrRight PA Volume' 24"
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
    ]

    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal stereo speakers (protected FullIO render)"

    EnableSequence [
        cset "name='SpkrLeft COMP Switch' 1"
        cset "name='SpkrLeft BOOST Switch' 1"
        cset "name='SpkrLeft DAC Switch' 1"
        cset "name='SpkrLeft PBR Switch' 1"
        cset "name='SpkrLeft VISENSE Switch' 1"
        cset "name='SpkrLeft CPS Switch' 1"
        cset "name='SpkrLeft WSA MODE' 0"
        cset "name='SpkrLeft PA Volume' 24"
        cset "name='SpkrRight COMP Switch' 1"
        cset "name='SpkrRight BOOST Switch' 1"
        cset "name='SpkrRight DAC Switch' 1"
        cset "name='SpkrRight PBR Switch' 1"
        cset "name='SpkrRight VISENSE Switch' 1"
        cset "name='SpkrRight CPS Switch' 1"
        cset "name='SpkrRight WSA MODE' 0"
        cset "name='SpkrRight PA Volume' 24"
        # Both VISENSE sources must be up before DAPM prepares VI/CPS.
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 1"
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 1"
    ]

    DisableSequence [
        # Tear down the VI backend before its source ports go away.
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_1' 0"
        cset "name='WSA WSA_AIF_VI Mixer WSA_SPKR_VI_2' 0"
        cset "name='SpkrLeft COMP Switch' 0"
        cset "name='SpkrLeft BOOST Switch' 0"
        cset "name='SpkrLeft DAC Switch' 0"
        cset "name='SpkrLeft PBR Switch' 0"
        cset "name='SpkrLeft VISENSE Switch' 0"
        cset "name='SpkrRight COMP Switch' 0"
        cset "name='SpkrRight BOOST Switch' 0"
        cset "name='SpkrRight DAC Switch' 0"
        cset "name='SpkrRight PBR Switch' 0"
        cset "name='SpkrRight VISENSE Switch' 0"
    ]

    Value {
        PlaybackChannels 2
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
    }
}

SectionDevice."Mic" {
    Comment "Internal microphone array"

    EnableSequence [
        # Windows EP16 physical lane mapping: DEC0 <- DMIC1, DEC1 <- DMIC0.
        cset "name='TX DMIC MUX0' 'DMIC1'"
        cset "name='TX DMIC MUX1' 'DMIC0'"
        cset "name='TX DEC0 MUX' 'MSM_DMIC'"
        cset "name='TX DEC1 MUX' 'MSM_DMIC'"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]

    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX DMIC MUX1' 'ZERO'"
        cset "name='TX DMIC MUX0' 'ZERO'"
    ]

    Value {
        CaptureChannels 2
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
    }
}
